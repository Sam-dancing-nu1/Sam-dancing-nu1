name: Refresh Profile Stats

on:
  schedule:
    - cron: '23 15 * * *'   # UTC 15:23 = 北京 23:23，避开整点拥堵
  workflow_dispatch:

permissions:
  contents: write   # 需要把刷新后的数据/SVG 推回仓库

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 优先用 PAT；未配 PAT 时回退 GITHUB_TOKEN
          # （差别：GITHUB_TOKEN 的 contributionCalendar 有返回 0 的已知问题，PAT 更准）
          token: ${{ secrets.GH_STATS_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch stats & regenerate SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: bash scripts/fetch_stats.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data assets/stats; then
            echo "::notice::no change, skip commit"
            exit 0
          fi
          git add data assets/stats
          git commit -m "chore(stats): refresh $(date -u +%F)"
          git push
