name: Refresh Profile Stats

on:
  schedule:
    - cron: '23 15 * * *'   # UTC 15:23 = 北京 23:23，避开整点拥堵
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须用 PAT：GITHUB_TOKEN 推送的提交不会触发 profile 页重新渲染
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet pillow

      - name: Fetch stats & regenerate SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: bash scripts/fetch_stats.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data assets/stats; then
            echo "::notice::no change, skip commit"
            exit 0
          fi
          git add data assets/stats
          git commit -m "chore(stats): refresh $(date -u +%F)"
          git push
